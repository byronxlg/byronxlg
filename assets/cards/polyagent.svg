<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-label="polyagent">
  <style>
    .bg { fill: #ffffff; stroke: #d1d9e0; }
    .name { fill: #0969da; font: 600 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .desc, .meta { fill: #59636e; font: 400 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .name { fill: #4493f8; }
      .desc, .meta { fill: #9198a1; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="399" height="119" rx="6"/>
  <text class="name" x="16" y="30">polyagent</text>
  <text class="desc" x="16" y="54">Multi-agent LLM simulation with credit-based economy<tspan x="16" dy="17"></tspan></text>
  <circle cx="21" cy="94" r="5" fill="#3572A5"/>
  <text class="meta" x="33" y="98">Python</text>
  <text class="meta" x="150" y="98">&#9733; 0</text>
